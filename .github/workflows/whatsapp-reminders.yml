name: WhatsApp reminders

# GitHub Actions' own `schedule` trigger turned out unreliable for this
# (best-effort only — observed running ~3 times in 19 hours against a
# "*/15 * * * *" cron, with gaps of several hours, so reminders silently
# stopped firing near their configured time). An external pinger
# (cron-job.org) now hits /api/cron/whatsapp-reminders every 15 minutes
# instead. `workflow_dispatch` is kept for manually re-running this by hand
# if needed — do not re-add a `schedule` trigger here, it would double-send
# every reminder alongside the external pinger.
on:
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call reminders endpoint
        run: |
          status=$(curl -s -o /dev/stderr -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://health-tracker-sepia.vercel.app/api/cron/whatsapp-reminders")
          echo "HTTP status: $status"
          if [ "$status" -ge 300 ]; then
            exit 1
          fi
